name: pnpm

on:
  pull_request:
    paths:
      - pnpm/**
      - .github/workflows/pnpm.yml
      - .github/buildkitd.toml
  push:
    branches:
      - master
    paths:
      - pnpm/**
      - .github/workflows/pnpm.yml
      - .github/buildkitd.toml
  schedule:
    - cron: "10 16 * * *" # UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [20-alpine, 22-alpine, 22-bookworm-slim, 24-alpine, 24-bookworm-slim]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkitd.toml
      - name: Login to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: harbor.softleader.com.tw
          username: ${{ secrets.SL_HARBOR_ROBOT }}
          password: ${{ secrets.SL_HARBOR_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./pnpm
          file: ./pnpm/Dockerfile.${{ matrix.tag }}
          platforms: linux/amd64
          tags: harbor.softleader.com.tw/library/pnpm/node:${{ matrix.tag }}
          provenance: false
          no-cache: true
          pull: true
          push: ${{ github.event_name != 'pull_request' }}

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: liskin/gh-workflow-keepalive@v1
