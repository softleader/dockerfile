name: pipeline-tool-images

on:
  pull_request:
    paths:
      - go-ci/**
      - docker-ci/**
      - .github/workflows/pipeline-tool-images.yml
      - .github/buildkitd.toml
  push:
    branches:
      - master
    paths:
      - go-ci/**
      - docker-ci/**
      - .github/workflows/pipeline-tool-images.yml
      - .github/buildkitd.toml
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-ci-1-27:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkitd.toml
      - name: Login to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: harbor.softleader.com.tw
          username: ${{ secrets.SL_HARBOR_ROBOT }}
          password: ${{ secrets.SL_HARBOR_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./go-ci/Dockerfile.1.27
          platforms: linux/amd64
          tags: harbor.softleader.com.tw/library/go-ci:1.27
          provenance: false
          no-cache: true
          pull: true
          push: ${{ github.event_name != 'pull_request' }}

  docker-ci-27-5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkitd.toml
      - name: Login to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: harbor.softleader.com.tw
          username: ${{ secrets.SL_HARBOR_ROBOT }}
          password: ${{ secrets.SL_HARBOR_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker-ci/Dockerfile.27.5
          platforms: linux/amd64
          tags: harbor.softleader.com.tw/library/docker-ci:27.5
          provenance: false
          no-cache: true
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
